<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>huzaimm01 / misc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#050912;
    --navy-900:#0b1226;
    --navy-850:#0f1830;
    --navy-800:#152040;
    --navy-700:#1e2c52;
    --line:#26355c;
    --line-soft:#1a2544;
    --text:#e9edf9;
    --text-dim:#8b96b8;
    --text-faint:#586088;
    --volt:#cdff3f;
    --cyan:#5fe0e8;
    --amber:#ffb454;
    --coral:#ff8a7a;
    --mint:#7bd99a;
    --err:#ff7a7a;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--navy-950);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    overflow-x:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 20px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  
  .bg-grid{
    position:fixed; inset:-10%;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:42px 42px;
    opacity:0.35;
    -webkit-mask-image:radial-gradient(circle at 50% 35%, black 0%, transparent 68%);
    mask-image:radial-gradient(circle at 50% 35%, black 0%, transparent 68%);
    pointer-events:none;
    will-change:transform;
    transition:transform 0.4s ease-out;
    z-index:0;
  }

  .bg-glow{
    position:fixed;
    top:-20%; left:50%;
    width:900px; height:900px;
    transform:translateX(-50%);
    background:radial-gradient(circle, rgba(205,255,63,0.08) 0%, rgba(205,255,63,0) 60%);
    pointer-events:none;
    z-index:0;
  }

  .cursor-glow{
    position:fixed;
    top:0; left:0;
    width:560px; height:560px;
    margin-left:-280px; margin-top:-280px;
    background:radial-gradient(circle, rgba(205,255,63,0.16) 0%, rgba(205,255,63,0.05) 45%, rgba(205,255,63,0) 72%);
    pointer-events:none;
    z-index:0;
    opacity:0;
    transition:opacity 0.5s ease;
    will-change:transform;
  }
  .cursor-glow.visible{ opacity:1; }

 
  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
  }

 
  .breadcrumb{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
    font-family:'Space Grotesk', sans-serif;
    font-size:clamp(28px, 5.4vw, 42px);
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0 0 6px 0;
    opacity:0;
    animation:riseIn 0.6s cubic-bezier(.2,.8,.2,1) 0.05s forwards;
  }

  .crumb-user{
    background:none;
    border:none;
    padding:0;
    margin:0;
    font:inherit;
    color:var(--text);
    cursor:pointer;
    position:relative;
    transition:color 0.25s ease;
  }
  .crumb-user::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-4px;
    height:2px;
    background:var(--volt);
    transform:scaleX(0);
    transform-origin:right;
    transition:transform 0.3s cubic-bezier(.2,.8,.2,1);
  }
  .crumb-user:hover{ color:var(--volt); }
  .crumb-user:hover::after{ transform:scaleX(1); transform-origin:left; }
  .crumb-user:focus-visible{ outline:2px solid var(--volt); outline-offset:4px; border-radius:2px; }

  .slash{ color:var(--text-faint); font-weight:400; }
  .crumb-current{ color:var(--text-dim); }

  .cursor{
    color:var(--volt);
    animation:blink 1.1s step-end infinite;
    font-weight:400;
  }

  .subline{
    color:var(--text-faint);
    font-size:13px;
    margin:0 0 34px 0;
    opacity:0;
    animation:riseIn 0.6s cubic-bezier(.2,.8,.2,1) 0.15s forwards;
  }

  
  .explorer{
    border:1px solid var(--line);
    background:linear-gradient(180deg, var(--navy-900), var(--navy-850));
    border-radius:10px;
    overflow:hidden;
    opacity:0;
    animation:riseIn 0.6s cubic-bezier(.2,.8,.2,1) 0.25s forwards;
  }

  .explorer-label{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    color:var(--text-dim);
    font-size:13px;
    letter-spacing:0.02em;
  }
  .explorer-label .count{
    color:var(--text-faint);
    font-size:12px;
  }

  .file-list{
    list-style:none;
    margin:0;
    padding:6px 0;
  }

  .file-row{
    display:flex;
    align-items:center;
    gap:2px;
    padding:0;
  }

  .tree-chars{
    color:var(--line);
    padding:11px 0 11px 20px;
    user-select:none;
    font-size:14px;
    white-space:pre;
  }

  .file-btn{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
    background:none;
    border:none;
    text-align:left;
    padding:11px 20px 11px 6px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--text);
    cursor:pointer;
    position:relative;
    transition:background 0.18s ease, color 0.18s ease;
  }
  .file-btn:hover, .file-btn:focus-visible{
    background:var(--navy-800);
    color:#fff;
  }
  .file-btn:focus-visible{ outline:2px solid var(--volt); outline-offset:-2px; }

  .file-icon{ flex-shrink:0; opacity:0.9; }

  .file-name{ flex:1; }
  .file-name .ext{ color:var(--text-faint); }
  .file-btn:hover .file-name .ext{ color:var(--text-dim); }

  .go-arrow{
    color:var(--text-faint);
    opacity:0;
    transform:translateX(-4px);
    transition:opacity 0.18s ease, transform 0.18s ease, color 0.18s ease;
    font-size:14px;
  }
  .file-btn:hover .go-arrow{ opacity:1; transform:translateX(0); }

  
  .state-row{
    padding:26px 20px;
    color:var(--text-faint);
    font-size:13.5px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .spinner{
    width:12px; height:12px;
    border-radius:50%;
    border:2px solid var(--line);
    border-top-color:var(--volt);
    animation:spin 0.8s linear infinite;
    flex-shrink:0;
  }
  .state-row a{ color:var(--volt); text-decoration:none; }
  .state-row a:hover{ text-decoration:underline; }

  
  .status-bar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:18px;
    padding-left:2px;
    color:var(--text-faint);
    font-size:12px;
    opacity:0;
    animation:riseIn 0.6s cubic-bezier(.2,.8,.2,1) 0.35s forwards;
  }
  .dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--text-faint);
    flex-shrink:0;
    transition:background 0.3s ease;
  }
  .dot.live{ background:var(--mint); box-shadow:0 0 0 0 rgba(123,217,154,0.5); animation:pulse 2s ease-out infinite; }
  .dot.error{ background:var(--err); }

 
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes blink{
    0%,45%{ opacity:1; } 50%,95%{ opacity:0; } 100%{ opacity:1; }
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(123,217,154,0.45); }
    70%{ box-shadow:0 0 0 6px rgba(123,217,154,0); }
    100%{ box-shadow:0 0 0 0 rgba(123,217,154,0); }
  }

  
  .arrow-overlay{
    position:fixed; inset:0;
    z-index:50;
    pointer-events:none;
    opacity:0;
    background:radial-gradient(circle at 50% 50%, rgba(15,24,48,0.94), rgba(5,9,18,0.98));
    transition:opacity 0.28s ease;
  }
  .arrow-overlay.active{
    opacity:1;
    pointer-events:all;
  }
  .arrow-track{
    position:absolute;
    top:50%; left:0;
    width:100%;
    transform:translateY(-50%);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .arrow-overlay .caption{
    position:absolute;
    top:calc(50% + 56px);
    left:50%;
    transform:translateX(-50%);
    color:var(--text-faint);
    font-size:13px;
    letter-spacing:0.04em;
    opacity:0;
  }
  .arrow-overlay.active .caption{
    animation:fadeHold 0.9s ease forwards;
  }
  @keyframes fadeHold{
    0%{ opacity:0; } 25%{ opacity:1; } 80%{ opacity:1; } 100%{ opacity:0; }
  }

  .chevrons{ display:flex; gap:6px; }
  .chevrons svg{ display:block; }

  .arrow-overlay.active.forward .chevrons{
    animation:travelForward 0.85s cubic-bezier(.5,0,.3,1) forwards;
  }
  .arrow-overlay.active.backward .chevrons{
    animation:travelBackward 0.85s cubic-bezier(.5,0,.3,1) forwards;
  }

  @keyframes travelForward{
    0%{ transform:translateX(-70vw); opacity:0; }
    18%{ opacity:1; }
    100%{ transform:translateX(70vw); opacity:0.15; }
  }
  @keyframes travelBackward{
    0%{ transform:translateX(70vw) scaleX(-1); opacity:0; }
    18%{ opacity:1; }
    100%{ transform:translateX(-70vw) scaleX(-1); opacity:0.15; }
  }

  @media (max-width:480px){
    .breadcrumb{ font-size:26px; }
    .tree-chars{ padding-left:14px; font-size:12px; }
    .file-btn{ padding-right:14px; font-size:13.5px; }
  }
</style>
</head>
<body>

  <div class="bg-grid" id="bgGrid"></div>
  <div class="bg-glow"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <div class="page">
    <div class="breadcrumb">
      <button class="crumb-user" id="userCrumb" aria-label="Open huzaimm01 on GitHub">huzaimm01</button><span class="slash">/</span><span class="crumb-current">misc</span><span class="cursor">▌</span>
    </div>
    <p class="subline">a directory of small things, rendered live from the repo</p>

    <div class="explorer">
      <div class="explorer-label">
        <span>~/misc</span>
        <span class="count" id="fileCount"></span>
      </div>
      <ul class="file-list" id="fileList" aria-live="polite">
        <li class="state-row"><span class="spinner"></span> reading directory…</li>
      </ul>
    </div>

    <div class="status-bar">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">connecting to github…</span>
    </div>
  </div>

  <div class="arrow-overlay" id="arrowOverlay" aria-hidden="true">
    <div class="arrow-track">
      <div class="chevrons" id="chevrons">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#cdff3f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" style="opacity:0.6"><path d="M9 6l6 6-6 6" stroke="#cdff3f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" style="opacity:0.3"><path d="M9 6l6 6-6 6" stroke="#cdff3f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="caption" id="overlayCaption"></div>
  </div>

<script>
(function(){
  const OWNER = 'huzaimm01';
  const REPO = 'misc';
  const PAGES_BASE = `https://${OWNER}.github.io/${REPO}/`;
  const ACCENTS = ['#cdff3f', '#5fe0e8', '#ff8a7a', '#7bd99a'];

  const fileListEl = document.getElementById('fileList');
  const fileCountEl = document.getElementById('fileCount');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const overlay = document.getElementById('arrowOverlay');
  const chevrons = document.getElementById('chevrons');
  const caption = document.getElementById('overlayCaption');
  const bgGrid = document.getElementById('bgGrid');
  const cursorGlow = document.getElementById('cursorGlow');

  // im following you
  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let glowX = mouseX, glowY = mouseY;

  window.addEventListener('mousemove', (e)=>{
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursorGlow.classList.add('visible');

    const gx = (mouseX / window.innerWidth - 0.5) * 18;
    const gy = (mouseY / window.innerHeight - 0.5) * 18;
    bgGrid.style.transform = `translate(${-gx}px, ${-gy}px)`;
  });
  window.addEventListener('mouseleave', ()=> cursorGlow.classList.remove('visible'));

  function animateGlow(){
    glowX += (mouseX - glowX) * 0.12;
    glowY += (mouseY - glowY) * 0.12;
    cursorGlow.style.transform = `translate3d(${glowX}px, ${glowY}px, 0)`;
    requestAnimationFrame(animateGlow);
  }
  animateGlow();

  function fileIcon(color){
    return `<svg class="file-icon" width="15" height="15" viewBox="0 0 24 24" fill="none">
      <path d="M6 2h9l5 5v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="${color}" stroke-width="1.6" fill="none"/>
      <path d="M15 2v5h5" stroke="${color}" stroke-width="1.6" fill="none"/>
    </svg>`;
  }

  function splitName(name){
    const i = name.lastIndexOf('.');
    return i === -1 ? {base:name, ext:''} : {base:name.slice(0,i), ext:name.slice(i)};
  }

  function travel(direction, destinationUrl, label){
    overlay.classList.remove('forward','backward','active');
    void overlay.offsetWidth; // restart animation
    caption.textContent = label || '';
    overlay.classList.add('active', direction);

    let navigated = false;
    const go = () => {
      if(navigated) return;
      navigated = true;
      window.location.href = destinationUrl;
    };
    chevrons.addEventListener('animationend', go, { once:true });
    // safety fallback in case animationend doesn't fire
    setTimeout(go, 1100);
  }

  document.getElementById('userCrumb').addEventListener('click', ()=>{
    travel('backward', `https://github.com/${OWNER}`, `github.com/${OWNER}`);
  });

  function renderEmpty(){
    fileListEl.innerHTML = `<li class="state-row">no .html files in the repo yet — check back soon</li>`;
    fileCountEl.textContent = '0 files';
    setStatus('live', `watching ${OWNER}/${REPO}`);
  }

  function renderError(){
    fileListEl.innerHTML = `<li class="state-row">couldn't reach github right now — <a href="https://github.com/${OWNER}/${REPO}" target="_blank" rel="noopener">view the repo directly</a></li>`;
    fileCountEl.textContent = '';
    setStatus('error', 'connection failed');
  }

  function setStatus(state, text){
    statusDot.className = 'dot' + (state === 'live' ? ' live' : state === 'error' ? ' error' : '');
    statusText.textContent = text;
  }

  function renderFiles(files){
    if(files.length === 0){ renderEmpty(); return; }

    fileCountEl.textContent = `${files.length} file${files.length === 1 ? '' : 's'}`;
    fileListEl.innerHTML = '';

    files.forEach((file, i)=>{
      const isLast = i === files.length - 1;
      const connector = isLast ? '└──' : '├──';
      const color = ACCENTS[i % ACCENTS.length];
      const { base, ext } = splitName(file.name);

      const li = document.createElement('li');
      li.className = 'file-row';
      li.style.opacity = '0';
      li.style.animation = `riseIn 0.4s cubic-bezier(.2,.8,.2,1) ${0.3 + i * 0.05}s forwards`;

      li.innerHTML = `
        <span class="tree-chars">${connector}</span>
        <button class="file-btn" data-name="${file.name}">
          ${fileIcon(color)}
          <span class="file-name">${base}<span class="ext">${ext}</span></span>
          <span class="go-arrow">open →</span>
        </button>
      `;

      li.querySelector('.file-btn').addEventListener('click', ()=>{
        travel('forward', PAGES_BASE + file.name, PAGES_BASE + file.name);
      });

      fileListEl.appendChild(li);
    });

    setStatus('live', `watching ${OWNER}/${REPO} · updated just now`);
  }

  async function loadFiles(){
    try{
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/`);
      if(!res.ok) throw new Error('bad response');
      const data = await res.json();
      const htmlFiles = data
        .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.html'))
        .sort((a,b)=>a.name.localeCompare(b.name));
      renderFiles(htmlFiles);
    }catch(err){
      renderError();
    }
  }

  loadFiles();
})();
</script>

</body>
</html>
